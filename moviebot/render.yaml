services:
  - type: web
    name: moviebot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: WATCH_REGION
        value: IR
      - key: PORT
        value: 8080
